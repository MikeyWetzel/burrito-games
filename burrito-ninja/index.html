<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a170c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Burrito Ninja</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌯</text></svg>">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a170c;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
.hud-btn{position:fixed;z-index:2;bottom:calc(10px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:2px solid #f3d9a4;background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
#mute{right:calc(10px + env(safe-area-inset-right))}
#home{left:calc(10px + env(safe-area-inset-left))}
</style>
</head><body>
<canvas id="c"></canvas>
<button class="hud-btn" id="mute" aria-label="Toggle sound">🔊</button>
<a class="hud-btn" id="home" href="../" aria-label="Back to Burrito Games">🏠</a>
<script src="../shared/burrito-art.js"></script>
<script src="ninja.js"></script>
<!-- Revision label. Convention: REV = '1.N', N = revision count (started at commits touching this folder). Bump N on every edit. -->
<script>
const REV = '1.1';
(function(){var e=document.createElement('div');e.id='rev-label';e.textContent=REV;e.setAttribute('aria-hidden','true');
e.style.cssText='position:fixed;right:calc(4px + env(safe-area-inset-right,0px));bottom:calc(3px + env(safe-area-inset-bottom,0px));font:10px/1 system-ui,sans-serif;color:rgba(128,128,128,.6);pointer-events:none;z-index:2147483647;user-select:none;';
(document.body||document.documentElement).appendChild(e);})();
</script>
</body></html>
