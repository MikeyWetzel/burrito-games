<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9a15c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Angry Burritos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌯</text></svg>">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9a15c;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
.hud{position:fixed;z-index:2;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.hud .r{margin-left:auto;text-align:right;color:#fff;text-shadow:0 2px 0 #000,0 0 3px #000;font-weight:900}
.hud .score{font-size:26px}.hud .sub{font-size:13px}
.rb{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#ffd84a,#e88a00);box-shadow:0 3px 0 #7a3a00;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;text-shadow:0 1px 0 #000;padding:0}
.overlay{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);color:#fff;text-align:center}
.overlay.show{display:flex}
.card{box-sizing:border-box;background:linear-gradient(#7a4a22,#5a3214);border:4px solid #e9c27a;border-radius:18px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.35);max-width:360px;width:100%}
h1{margin:0 0 6px;font-size:44px;line-height:1;color:#ffd84a;text-shadow:0 3px 0 #8a2a00,0 0 6px #000;-webkit-text-stroke:1px #6a1a00}
h2{margin:0 0 10px;font-size:30px;color:#ffd84a;text-shadow:0 3px 0 #000}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:60px;height:56px;margin:6px;padding:0 18px;border-radius:16px;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#9be04a,#3a9a1a);box-shadow:0 4px 0 #1a5a0a;color:#fff;font-size:22px;font-weight:900;text-shadow:0 2px 0 #000;cursor:pointer;font-family:inherit}
.btn.alt{background:radial-gradient(circle at 35% 30%,#ffd84a,#e88a00);box-shadow:0 4px 0 #7a3a00}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.lvl{aspect-ratio:1;border-radius:14px;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#ff8a5a,#c43a1e);box-shadow:0 4px 0 #7a1a08;color:#fff;font-size:24px;font-weight:900;text-shadow:0 2px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0}
.lvl small{font-size:12px;letter-spacing:-1px;color:#ffd84a}.lvl.locked{background:#666;box-shadow:0 4px 0 #333;opacity:.7}
.stars{font-size:52px;letter-spacing:4px;margin:4px 0;color:#ffd84a;text-shadow:0 3px 0 #8a5a00}.stars .off{color:rgba(0,0,0,.35);text-shadow:none}
.big{font-size:28px;font-weight:900}
</style>
</head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud" style="display:none">
  <button class="rb" id="pauseBtn" aria-label="Pause">II</button>
  <button class="rb" id="muteBtn" aria-label="Sound">🔊</button>
  <div class="r"><div class="score" id="score">0</div><div class="sub" id="lvlinfo"></div><div class="sub" id="lvlbest"></div></div>
</div>
<div class="overlay show" id="menu"><div class="card">
  <h1>ANGRY<br>BURRITOS</h1>
  <p>Fling burritos off the giant fork and knock out the avocados, nacho chips, jalapeños, limes, salsa cups and tacos hiding in the cantina kitchen!</p><p style="font-size:13px;opacity:.9">🌯 Classic: tap for a boost · Breakfast: tap to split · Wet: tap for a salsa blast</p>
  <button class="btn" id="playBtn">▶ PLAY</button><br>
  <a class="btn alt" href="../" style="text-decoration:none">🏠</a>
</div></div>
<div class="overlay" id="levels"><div class="card">
  <h2>PICK A KITCHEN</h2><div class="grid" id="grid"></div>
  <button class="btn alt" id="lvBack">◀</button>
</div></div>
<div class="overlay" id="pause"><div class="card">
  <h2>PAUSED</h2>
  <button class="btn" id="resume">▶</button><button class="btn alt" id="restart">↻</button><button class="btn alt" id="toLevels">☰</button>
</div></div>
<div class="overlay" id="done"><div class="card">
  <h2 id="doneTitle">Level cleared!</h2><div id="doneSub" style="font-size:15px"></div>
  <div class="stars" id="doneStars"></div>
  <div class="big" id="doneScore"></div><div id="doneBest"></div>
  <button class="btn alt" id="dLevels">☰</button><button class="btn alt" id="dRetry">↻</button><button class="btn" id="dNext">Next ▶</button>
</div></div>
<script src="vendor/planck.min.js?v=20261019"></script>
<script src="levels.js?v=20261019b"></script>
<script src="../shared/stats.js?v=1"></script>
<script src="game.js?v=20261019b"></script>
<!-- Revision label. Convention: REV = '1.N', N = revision count (started at commits touching this folder). Bump N on every edit. -->
<script>
const REV = '1.4';
(function(){var e=document.createElement('div');e.id='rev-label';e.textContent=REV;e.setAttribute('aria-hidden','true');
e.style.cssText='position:fixed;right:calc(4px + env(safe-area-inset-right,0px));bottom:calc(3px + env(safe-area-inset-bottom,0px));font:10px/1 system-ui,sans-serif;color:rgba(128,128,128,.6);pointer-events:none;z-index:2147483647;user-select:none;';
(document.body||document.documentElement).appendChild(e);})();
</script>
</body></html>
